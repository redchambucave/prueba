<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasa BCV - justcarlux</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      max-width: 440px; margin: 40px auto; padding: 20px;
      background: #f0f2f5;
    }
    .card { background: white; padding: 24px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h2 { margin: 0 0 16px; color: #111; }
    .tasa-box {
      background: linear-gradient(135deg, #0066cc, #0099ff);
      color: white; padding: 18px; border-radius: 10px;
      text-align: center; margin-bottom: 16px;
    }
    .tasa-box .label { font-size: .8em; opacity: .9; }
    .tasa-box .valor { font-size: 1.9em; font-weight: bold; margin: 4px 0; }
    .tasa-box .fecha { font-size: .78em; opacity: .85; }
    input, select, button {
      width: 100%; padding: 12px; margin: 6px 0;
      border: 1px solid #ddd; border-radius: 8px; font-size: 1em;
    }
    button { background: #0066cc; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0052a3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .resultado {
      background: #e8f4ff; padding: 16px; border-radius: 10px;
      margin-top: 12px; text-align: center; font-size: 1.3em;
      font-weight: bold; color: #0066cc; min-height: 24px;
    }
    .status { font-size: .8em; text-align: center; margin-top: 8px; color: #666; }
    .status.ok { color: #0a8f3c; }
    .status.err { color: #d32f2f; }
    .debug {
      background: #111; color: #0f0; font-family: monospace;
      font-size: 11px; padding: 10px; border-radius: 6px;
      margin-top: 10px; max-height: 180px; overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>💵 Tasa BCV</h2>

    <div class="tasa-box">
      <div class="label">Dólar (USD) · justcarlux.dev</div>
      <div class="valor" id="tasaValor">Cargando…</div>
      <div class="fecha" id="tasaFecha"></div>
    </div>

    <input type="number" id="monto" value="1" step="0.01" min="0">
    <select id="tipo">
      <option value="usd-bs">USD → Bolívares</option>
      <option value="bs-usd">Bolívares → USD</option>
    </select>
    <button id="btn" onclick="convertir()" disabled>Convertir</button>

    <div class="resultado" id="resultado">—</div>
    <div class="status" id="status">Cargando tasa…</div>
    <pre class="debug" id="debug"></pre>
  </div>

  <script>
    const API = 'https://bcv.justcarlux.dev/api/v1/rates';

    // Proxies CORS (se prueban en orden hasta que uno funcione)
    const PROXIES = [
      { n: 'allorigins-raw',  u: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
      { n: 'allorigins-get',  u: u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u) },
      { n: 'corsproxy.io',    u: u => 'https://corsproxy.io/?' + encodeURIComponent(u) },
      { n: 'codetabs',        u: u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) },
      { n: 'thingproxy',      u: u => 'https://thingproxy.freeboard.io/fetch/' + u },
      { n: 'directo',         u: u => u }
    ];

    let tasa = 0;
    const $ = id => document.getElementById(id);
    const log = m => { $('debug').textContent += m + '\n'; };

    function pintarTasa(valor, fechaMs, origen) {
      tasa = valor;
      $('tasaValor').textContent = valor.toFixed(4) + ' Bs';
      $('tasaFecha').textContent = fechaMs
        ? 'Actualizado: ' + new Date(fechaMs).toLocaleString('es-VE')
        : '';
      $('status').textContent = '✅ Fuente: ' + origen;
      $('status').className = 'status ok';
      $('btn').disabled = false;
      convertir();
    }

    // Parsea el JSON sin importar el proxy (algunos envuelven en {contents: "..."})
    function extraerJSON(data) {
      if (typeof data === 'string') return JSON.parse(data);
      if (data && typeof data.contents === 'string') return JSON.parse(data.contents);
      if (data && data.rates) return data;
      return null;
    }

    async function cargarTasa() {
      $('debug').textContent = '';
      log('Protocolo: ' + location.protocol);
      log('API objetivo: ' + API);
      log('---');

      // Caché primero
      const ts = parseInt(localStorage.getItem('jc_ts') || '0');
      if (Date.now() - ts < 3600000) {
        const v = parseFloat(localStorage.getItem('jc_usd'));
        if (v) pintarTasa(v, ts, 'caché');
      }

      for (const p of PROXIES) {
        try {
          log(`→ ${p.n}…`);
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 8000);

          const res = await fetch(p.u(API), { cache: 'no-store', signal: ctrl.signal });
          clearTimeout(timer);

          if (!res.ok) throw new Error('HTTP ' + res.status);

          const raw = await res.json();
          const data = extraerJSON(raw);
          if (!data || !data.rates || !data.rates.usd) throw new Error('Sin rates.usd');

          const valor = parseFloat(data.rates.usd);
          const fecha = data.updatedAt;

          localStorage.setItem('jc_usd', valor);
          localStorage.setItem('jc_ts', fecha);

          pintarTasa(valor, fecha, p.n + ' → justcarlux');
          log(`✅ ${p.n}: ${valor} Bs`);
          return;

        } catch (e) {
          log(`❌ ${p.n}: ${e.message}`);
        }
      }

      // Fallback final
      const v = localStorage.getItem('jc_usd');
      if (v) {
        pintarTasa(parseFloat(v), ts, 'caché (offline)');
      } else {
        $('status').textContent = '❌ Ningún proxy funcionó. Abre con Live Server.';
        $('status').className = 'status err';
      }
    }

    function convertir() {
      if (!tasa) return;
      const m = parseFloat($('monto').value) || 0;
      const t = $('tipo').value;
      $('resultado').textContent = t === 'usd-bs'
        ? (m * tasa).toFixed(2) + ' Bs'
        : (m / tasa).toFixed(4) + ' USD';
    }

    $('monto').addEventListener('input', convertir);
    $('tipo').addEventListener('change', convertir);

    cargarTasa();
  </script>
</body>
</html>
